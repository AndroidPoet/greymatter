[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greymatter-ai"
version = "1.0.0"
description = "Human-Like Memory for AI CLIs - Works with Claude, Gemini, Ollama"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["ai", "memory", "claude", "gemini", "ollama", "llm", "cli", "brain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# NO DEPENDENCIES - uses only Python stdlib!
dependencies = []

[project.optional-dependencies]
# Optional: Better semantic search with neural embeddings
neural = ["sentence-transformers>=2.0.0"]

[project.scripts]
# Main commands
"claude++" = "greymatter.wrapper:main"
"gemini++" = "greymatter.wrapper:main"
"ollama++" = "greymatter.wrapper:main"
"gm" = "greymatter.wrapper:main"
"mem" = "greymatter.cli:main"
"mem-viz" = "greymatter.visualize:main"
# Claude Code hook integration
"gm-precompact" = "greymatter.claude_hooks:precompact_main"
"gm-resume" = "greymatter.claude_hooks:resume_main"
"gm-hooks" = "greymatter.claude_hooks:hooks_main"

[project.urls]
Homepage = "https://github.com/greymatter-ai/greymatter"
Documentation = "https://github.com/greymatter-ai/greymatter#readme"
Repository = "https://github.com/greymatter-ai/greymatter"

[tool.setuptools.packages.find]
where = ["."]
include = ["greymatter*"]
